name: Deploy

# ECR에 이미지를 올리고 EC2에서 compose.prod.yml로 교체한다(배포 v0.5 2장).
# EC2 준비(배포 v0.5 4장) 전이라 수동 실행만. 준비가 끝나면 아래 push 트리거 주석을 풀어 develop 자동 배포로 바꾼다.
on:
  workflow_dispatch:
  # push:
  #   branches: [ develop ]

# 배포가 겹치지 않게 한 번에 하나만 돈다(뒤에 온 실행은 앞 실행이 끝날 때까지 기다린다)
concurrency:
  group: deploy
  cancel-in-progress: false

# AWS 인증은 배포 전용 IAM 사용자의 액세스 키(GitHub Secrets)로 한다. 그 사용자는 두 ECR 저장소에 푸시만 할 수 있다.
# GitHub OIDC 역할이 더 안전하지만 AWS 무료 플랜(새 AWS 경험)은 IAM 자격 증명 공급자를 쓸 수 없다(배포 v0.5 4.2).
# 플랜을 올리면 role-to-assume 방식으로 되돌리고 permissions에 id-token: write를 다시 넣는다.
permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2 # AWS 무료 플랜은 프로젝트 리전(시드니)만 쓸 수 있다(배포 v0.5 4장)
  APP_DIR: townsignal # EC2 사용자 홈 아래 배포 폴더

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - uses: docker/setup-buildx-action@v4.4.1

      # 태그: 커밋 SHA(롤백용) + latest
      - name: API 이미지 → ECR townsignal-api
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/townsignal-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/townsignal-api:latest
          provenance: false # 증명(attestation) 매니페스트를 만들지 않는다 — ECR에 태그 없는 이미지로 쌓여 수명 주기 10개 한도를 잡아먹음
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # 운영 배치는 주간 지원사업 작업만 돈다 → 학습 라이브러리 없는 요구사항으로 빌드
      - name: 주간 배치 이미지 → ECR townsignal-batch
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.batch
          build-args: REQUIREMENTS=requirements/weekly.txt
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/townsignal-batch:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/townsignal-batch:latest
          provenance: false
          cache-from: type=gha,scope=batch
          cache-to: type=gha,scope=batch,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SG_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4

      # 보안 그룹의 22번은 팀원 IP만 연다. GitHub 러너 IP는 매번 바뀌므로 배포하는 동안만 이 러너의 IP를 열고
      # 끝나면(실패해도) 닫는다. 배포 IAM 사용자는 이 보안 그룹의 인바운드 규칙 추가 · 삭제만 할 수 있다(배포 v0.6 4.2).
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 러너 IP를 SSH 허용에 잠시 추가
        id: runner_ip
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID"             --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$ip/32,Description=github-actions-deploy}]"

      # compose 파일과 스키마만 서버에 둔다. .env는 서버에서 직접 관리한다
      - name: 배포 파일 복사
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: compose.prod.yml,db/schema.sql
          target: ${{ env.APP_DIR }}

      # EC2는 인스턴스 IAM Role(ECR 읽기)로 로그인한다. 새 이미지를 먼저 받고(실패하면 기존 컨테이너가 그대로 남는다)
      # 교체한 뒤 /health를 확인한다. 60초 안에 안 뜨면 직전에 성공한 태그로 되돌리고 실패 처리한다.
      - name: EC2 교체 · 헬스체크
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -eu
            cd ~/${{ env.APP_DIR }}
            mkdir -p backups logs
            export ECR_REGISTRY=${{ needs.build.outputs.registry }}
            COMPOSE="docker compose -f compose.prod.yml"
            NEW=${{ github.sha }}
            PREV=$(cat .deployed_tag 2>/dev/null || echo latest)

            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            IMAGE_TAG=$NEW $COMPOSE --profile batch pull api batch
            IMAGE_TAG=$NEW $COMPOSE up -d db api

            ok=""
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "health 확인 실패 — $PREV로 되돌린다"
              $COMPOSE logs --tail 80 api
              IMAGE_TAG=$PREV $COMPOSE up -d api
              exit 1
            fi

            echo "$NEW" > .deployed_tag
            docker image prune -f
            echo "배포 완료: $NEW"

      - name: 러너 IP를 SSH 허용에서 제거
        if: always() && steps.runner_ip.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID"             --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.runner_ip.outputs.ip }}/32}]"
