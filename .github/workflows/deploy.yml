name: Deploy API

# AWS(ECR/EC2/DB) 준비 전이라 당분간 수동 실행만 가능하도록 해둠.
# 인프라/시크릿 세팅 끝나면 트리거를 `push: branches: [ main ]`으로 바꿔서 자동 배포로 전환할 것.
on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: townsignal-api
  CONTAINER_NAME: townsignal-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 이미지 안에서 의존성을 설치하므로 빌드 단계가 따로 필요 없다.
      # 설정값은 파일로 복원하지 않고 컨테이너 환경변수로 주입한다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # EC2에는 Access Key를 두지 않는다 - 인스턴스에 IAM Role(ECR Pull 권한)을 붙여서
      # 그 역할로 자동 인증되도록 한다 (서버 탈취 시 자격증명 유출 방지).
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            docker rm -f ${{ env.CONTAINER_NAME }} || true

            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            docker run -d -p 8000:8000 --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -e APP_ENV=prod \
              -e TZ=Asia/Seoul \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e CORS_ORIGINS='${{ secrets.CORS_ORIGINS }}' \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

            docker image prune -f
