name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    # DB 테스트용 PostgreSQL 16. 로컬 docker compose의 db와 같은 계정 · DB 이름을 쓴다.
    # CI에서는 DB에 붙지 못하면 테스트가 skip이 아니라 실패한다(tests/conftest.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: townsignal
          POSTGRES_PASSWORD: townsignal
          POSTGRES_DB: townsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U townsignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://townsignal:townsignal@localhost:5432/townsignal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # batch 의존성(xgboost · scikit-survival 등)은 설치가 무거워 여기서는 제외한다.
      # 배치 코드가 바뀐 PR은 ci-batch.yml이 배치 의존성까지 설치해 따로 돌린다.
      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply schema
        run: psql postgresql://townsignal:townsignal@localhost:5432/townsignal -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Test
        run: pytest -q
