name: CI (batch)

# 배치 의존성(pandas · xgboost · scikit-survival · geopandas 등)까지 설치해 전체 테스트를 돌린다.
# 기본 CI(ci.yml)는 배치 의존성을 설치하지 않아 모델 학습 테스트(tests/test_sales_model.py)를 건너뛴다.
# 설치가 무거워 배치 · common · 요구사항 · 배치 테스트가 바뀐 경우에만 돈다.
on:
  push:
    branches: [ develop ]
    paths:
      - "batch/**"
      - "common/**"
      - "requirements/**"
      - "tests/test_sales_model.py"
      - "tests/test_backtest.py"
      - "tests/test_batch_*.py"
      - ".github/workflows/ci-batch.yml"
  pull_request:
    branches: [ develop ]
    paths:
      - "batch/**"
      - "common/**"
      - "requirements/**"
      - "tests/test_sales_model.py"
      - "tests/test_backtest.py"
      - "tests/test_batch_*.py"
      - ".github/workflows/ci-batch.yml"

jobs:
  test-batch:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: townsignal
          POSTGRES_PASSWORD: townsignal
          POSTGRES_DB: townsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U townsignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://townsignal:townsignal@localhost:5432/townsignal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (batch 포함)
        run: pip install -r requirements/batch.txt -r requirements/dev.txt

      - name: Apply schema
        run: psql postgresql://townsignal:townsignal@localhost:5432/townsignal -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Test
        run: pytest -q
